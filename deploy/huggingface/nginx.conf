# nginx for the Hugging Face Space: the same site as frontend/nginx.conf, run as a non-root user on port 7860,
# with the backend on 127.0.0.1:8080 in the same container. The Space page shows the app in a frame on
# huggingface.co, so that one origin may frame it. API docs are not published.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;

    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    server {
        listen 7860;
        server_name _;
        root /app/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://huggingface.co; base-uri 'self'; form-action 'self'" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            include /app/nginx-proxy.conf;
        }

        location = /actuator/health {
            proxy_pass http://127.0.0.1:8080;
            include /app/nginx-proxy.conf;
        }
        location /actuator/health/ {
            proxy_pass http://127.0.0.1:8080;
            include /app/nginx-proxy.conf;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://huggingface.co; base-uri 'self'; form-action 'self'" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
