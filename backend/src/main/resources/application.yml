spring:
  application:
    name: realitycheck
  datasource:
    # Defaults match docker-compose.yml when only the database container is running (`docker compose up db`).
    url: ${DB_URL:jdbc:postgresql://localhost:15432/realitycheck}
    username: ${DB_USERNAME:realitycheck}
    password: ${DB_PASSWORD:realitycheck}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/**

realitycheck:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    # template = the built-in analyst (no network). anthropic = Claude, used only when AI_API_KEY is set.
    provider: ${AI_PROVIDER:template}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-haiku-5-5}
    base-url: ${AI_BASE_URL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-retries: ${AI_MAX_RETRIES:2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:4000}
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:20}
  demo:
    seed-on-startup: ${REALITYCHECK_DEMO_SEED:false}
    reset-enabled: ${REALITYCHECK_DEMO_RESET_ENABLED:false}

---
# Used by the Docker deployment. No credential has a fallback here: a missing one stops startup.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  structured:
    format:
      console: ecs
