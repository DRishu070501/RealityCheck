# Serves the built single-page application and proxies backend paths to the `backend` service.
# Runs as the non-root `nginx` user (nginxinc/nginx-unprivileged) and listens on port 80.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Resolve `backend` through Docker's embedded DNS at request time, so nginx starts even if
    # the backend container is not up yet and follows it when its address changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # ----- Security headers (repeated in locations that add their own headers) -----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ----- Compression -----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    # ----- Container health check -----
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ----- Backend -----
    location /api/ {
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Only the health endpoint of the actuator is published.
    location = /actuator/health {
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
    }
    location /actuator/health/ {
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /v3/api-docs {
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Swagger UI ships its own inline bootstrap, so it gets a looser policy than the application.
    location /swagger-ui {
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    }

    # ----- Static assets -----
    # Vite emits content-hashed file names under /assets, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must always be revalidated so a new deployment is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Single-page application fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
