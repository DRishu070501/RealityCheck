name: realitycheck

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-realitycheck}
      POSTGRES_USER: ${POSTGRES_USER:-realitycheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      # Bound to loopback: the database is for local tools, not the network.
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-realitycheck}
      DB_USERNAME: ${POSTGRES_USER:-realitycheck}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      REALITYCHECK_DEMO_SEED: ${REALITYCHECK_DEMO_SEED:-false}
      REALITYCHECK_DEMO_RESET_ENABLED: ${REALITYCHECK_DEMO_RESET_ENABLED:-false}
      REALITYCHECK_DEMO_RESET_CRON: ${REALITYCHECK_DEMO_RESET_CRON:-}
      # The key reaches only the backend container; the frontend never sees it.
      AI_PROVIDER: ${AI_PROVIDER:-template}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4000}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-20}
      AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-}
      AI_INPUT_USD_PER_MTOK: ${AI_INPUT_USD_PER_MTOK:-0.10}
      AI_OUTPUT_USD_PER_MTOK: ${AI_OUTPUT_USD_PER_MTOK:-0.50}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 6

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  db-data:
